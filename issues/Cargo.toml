[package]
name = "issues"
version = "0.1.0"
edition = "2024"
description = "Project-local issue tracker for human + Claude Code collaboration"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
termimad = "0.35"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
